deployment:
  tasks:
    - export DEPLOYPATH=/home/cricketwicket/public_html/cricket/
    - /bin/cp * $DEPLOYPATH
    - git pull origin frontennd
    - rsync -av --exclude='.git' --exclude='storage' --exclude='vendor' --exclude='.env' . $DEPLOYPATH
    - cd $DEPLOYPATH
    - composer install --no-dev --prefer-dist
    - cp .env.example .env
    - php artisan key:generate
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan storage:link
    - chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache
